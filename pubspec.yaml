name: resto_app
description: Aplikasi Manajemen Restoran
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  provider: ^6.1.1
  intl: ^0.19.0
  image_picker: ^1.0.5
  shared_preferences: ^2.2.2
  cached_network_image: ^3.3.1 
  smooth_page_indicator: ^1.1.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/banner/
    - assets/images/menu/
    - assets/logo/